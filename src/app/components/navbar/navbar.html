<header class="sticky top-0 z-40 border-b border-line bg-paper/90 backdrop-blur">
  <div class="mx-auto flex h-[72px] max-w-shell items-center px-6">
    <a routerLink="/" class="flex items-center" aria-label="Go to home">
      <img
        src="/sources/images/tracelens-logo-wordmark.svg"
        alt="TraceLens"
        class="h-[34px] w-[190px] object-contain"
      />
    </a>

    <nav class="mx-auto hidden items-center gap-9 text-[15px] text-ink md:flex">
      <a class="navlink" routerLink="/product" routerLinkActive="active">Product</a>
      <a class="navlink" routerLink="/docs" routerLinkActive="active">Docs</a>
      <a class="navlink" routerLink="/pricing" routerLinkActive="active">Pricing</a>
    </nav>

    <div class="flex items-center gap-3">
      @if (auth.isAuthenticated()) {
        <span class="hidden max-w-[180px] truncate text-[14px] text-sub md:inline">
          {{ auth.currentUser()?.email }}
        </span>
        <button
          type="button"
          class="rounded-lg px-4 py-2 text-[15px] font-medium text-ink hover:bg-[#F5F5F4] transition-colors"
          (click)="auth.logout()"
        >
          Logout
        </button>
        <a
          routerLink="/dashboard"
          class="rounded-lg border border-brand bg-brand px-4 py-2 text-[15px] font-medium text-white shadow-sm hover:bg-[#dd451a] transition-colors"
        >
          Dashboard
        </a>
      } @else {
        <a
          routerLink="/signin"
          class="hidden md:flex rounded-lg px-4 py-2 text-[15px] font-medium text-ink hover:bg-[#F5F5F4] transition-colors"
        >
          Sign In
        </a>
        <a
          routerLink="/signup"
          class="rounded-lg border border-brand bg-brand px-4 py-2 text-[15px] font-medium text-white shadow-sm hover:bg-[#dd451a] transition-colors"
        >
          Get Started
        </a>
      }
    </div>
  </div>
</header>
