<main class="flex flex-1 items-center justify-center min-h-[calc(100vh-72px)] px-6 py-20">
  <div class="w-full max-w-[440px] rounded-xl2 border border-line bg-card p-10 shadow-card">
    <h1 class="text-center text-[30px] font-extrabold">Sign in to TraceLens</h1>

    <form class="mt-8 space-y-5" (submit)="$event.preventDefault()">
      <div>
        <label class="text-[14px] font-semibold" for="email">Email</label>
        <div class="mt-2 flex h-[48px] items-center gap-3 rounded-lg border border-line px-4 focus-within:border-brand">
          <i data-lucide="mail" class="h-4 w-4 text-mut"></i>
          <input id="email" type="email" placeholder="you@example.com" class="h-full w-full bg-transparent text-[15px] outline-none placeholder:text-mut" />
        </div>
      </div>
      <div>
        <label class="text-[14px] font-semibold" for="pw">Password</label>
        <div class="mt-2 flex h-[48px] items-center gap-3 rounded-lg border border-line px-4 focus-within:border-brand">
          <i data-lucide="lock" class="h-4 w-4 text-mut"></i>
          <input id="pw" type="password" value="passwordvalue" class="h-full w-full bg-transparent text-[15px] outline-none" />
          <i data-lucide="eye" class="h-4 w-4 cursor-pointer text-mut"></i>
        </div>
      </div>
      <button routerLink="/dashboard" class="h-[48px] w-full rounded-lg bg-brand text-[15px] font-semibold text-white hover:bg-[#dd451a]">Continue</button>
      <a routerLink="#" class="block text-[14px] font-medium text-brand">Forgot password?</a>
    </form>

    <div class="my-7 flex items-center gap-4 text-[13px] text-sub">
      <span class="h-px flex-1 bg-line"></span> or <span class="h-px flex-1 bg-line"></span>
    </div>

    <div class="space-y-3">
      <a routerLink="/dashboard" class="flex h-[48px] items-center justify-center gap-3 rounded-lg border border-line text-[15px] font-medium hover:border-ink/30">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#0F0F0F"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2.9-.3 1.9-.4 2.9-.4s2 .1 2.9.4c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
        Sign in with GitHub
      </a>
      <a routerLink="/dashboard" class="flex h-[48px] items-center justify-center gap-3 rounded-lg border border-line text-[15px] font-medium hover:border-ink/30">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.9 2.6 13.8l7.8 6.1C12.3 13.8 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-2.8-.4-4.1H24v7.8h12.7c-.3 2.1-1.6 5.3-4.7 7.4l7.6 5.9c4.5-4.2 6.5-10.3 6.5-17z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 47.5c6.2 0 11.4-2 15.2-5.6l-7.6-5.9c-2 1.4-4.7 2.4-7.6 2.4-6.4 0-11.7-4.3-13.6-10.1l-7.8 6.1C6.5 42.1 14.6 47.5 24 47.5z"/></svg>
        Sign in with Google
      </a>
    </div>

    <p class="mt-8 text-center text-[14px] text-sub">Don't have an account? <a routerLink="#" class="font-medium text-brand">Sign up</a></p>
  </div>
</main>
