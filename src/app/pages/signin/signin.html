<main class="flex flex-1 items-center justify-center min-h-[calc(100vh-72px)] px-6 py-20">
  <div class="w-full max-w-[440px] rounded-xl2 border border-line bg-card p-10 shadow-card">
    <h1 class="text-center text-[30px] font-extrabold">Sign in to TraceLens</h1>
    <p class="mt-3 rounded-lg bg-[#F5F5F4] px-4 py-3 text-center text-[13px] leading-relaxed text-sub">
      Demo account is filled in. Click Sign in to open the dashboard.
      <span class="mt-1 block font-medium text-ink">demo@tracelens.app · TraceLens1</span>
    </p>

    <form class="mt-8 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label class="text-[14px] font-semibold" for="email">Email</label>
        <div class="mt-2 flex h-[48px] items-center gap-3 rounded-lg border border-line px-4 focus-within:border-brand">
          <i data-lucide="mail" class="h-4 w-4 text-mut" aria-hidden="true"></i>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="you@example.com"
            class="h-full w-full bg-transparent text-[15px] outline-none placeholder:text-mut"
          />
        </div>
      </div>
      <div>
        <label class="text-[14px] font-semibold" for="pw">Password</label>
        <div class="mt-2 flex h-[48px] items-center gap-3 rounded-lg border border-line px-4 focus-within:border-brand">
          <i data-lucide="lock" class="h-4 w-4 text-mut" aria-hidden="true"></i>
          <input
            id="pw"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            class="h-full w-full bg-transparent text-[15px] outline-none"
          />
        </div>
      </div>

      @if (errorMessage()) {
        <p class="text-[14px] text-err" role="alert">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="submitting()"
        class="h-[48px] w-full rounded-lg bg-brand text-[15px] font-semibold text-white hover:bg-[#dd451a] disabled:opacity-50"
      >
        {{ submitting() ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>

    <p class="mt-8 text-center text-[14px] text-sub">
      Don't have an account?
      <a routerLink="/signup" class="font-medium text-brand">Create account</a>
    </p>
  </div>
</main>
